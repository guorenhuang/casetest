  <style>
    :root { --bg:#0f1419; --card:#1a2332; --accent:#3d8bfd; --text:#e7ecf3; --muted:#8b9bb4; }
    * { box-sizing: border-box; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; line-height: 1.55; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.5rem; }
    p.lead { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .grid { display: grid; gap: 1rem; max-width: 720px; }
    a.card {
      display: block; background: var(--card); border-radius: 10px; padding: 1rem 1.15rem;
      text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,.06);
      transition: border-color .15s, transform .1s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
    a.card strong { color: var(--accent); font-size: 0.8rem; letter-spacing: .04em; }
    a.card h2 { margin: .35rem 0 .25rem; font-size: 1.05rem; font-weight: 600; }
    a.card span { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
