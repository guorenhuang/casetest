services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/app.db
      STATIC_DIR: /app/static
      STRIPE_WEBHOOK_SECRET: whsec_test_local_default_secret
      APPLE_SHARED_SECRET: apple_shared_mock_secret
      STRIPE_SIGNATURE_TOLERANCE_SECONDS: "300"
    volumes:
      - q1data:/data

volumes:
  q1data:
    name: q1_shortdrama_data
